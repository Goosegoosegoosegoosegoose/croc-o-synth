# Build Croc-O-Synth for the FM-1 on GitHub and keep the package as a download.
# Run it from the repository's Actions tab ("Build firmware" > "Run workflow"); it also runs when the firmware changes.
# The toolchain and SDK steps are adapted from zvenson/fm1-build's build.yml (MIT, Copyright (c) 2026 zvenson):
# the same downloads and the same pinned actions, without its attestation and release steps. See PROVENANCE.md.
name: Build firmware

on:
  workflow_dispatch:
  push:
    branches: ['**']        # every branch is built and tested; only main is published as the latest release
    paths: ['app/**', 'base', 'build.sh', 'tests/**', 'tools/**', 'docs/INSTALL.txt', '.github/workflows/build.yml']

permissions:
  contents: write          # the "latest" release below

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages and font shaping
        run: |
          python3 -m pip install Pillow fonttools
          sudo apt-get install -y -qq libfribidi0

      - name: Tests in the simulator
        run: sh tests/run_tests.sh

      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build the package
        run: ./build.sh

      - name: Put the package and the installer tool in one folder
        run: |
          mkdir -p dist
          cp app/build/crocosynth.fwsc dist/
          cp base/tools/fm1_install.py base/tools/fm1ports.py base/tools/fm1_resources.py dist/
          cp base/LICENSE dist/LICENSE-installer-MPL-2.0.txt
          cp docs/INSTALL.txt dist/READ-ME-FIRST.txt
          cp tools/update-croc.bat dist/
          printf '%s\n%s\n' "$(grep -o 'CROC_BUILD "[^"]*"' app/app.c | cut -d'"' -f2)" "commit $GITHUB_SHA" > dist/BUILD.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: croc-o-synth-install
          path: dist/
          if-no-files-found: error

      # The newest build as a release, so it can be fetched without signing in:
      #   https://github.com/OWNER/REPO/releases/latest/download/croc-o-synth-install.zip
      # tools/update-croc.bat on a Windows PC downloads that and installs it.
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && zip -q -r ../croc-o-synth-install.zip .)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest croc-o-synth-install.zip --target "$GITHUB_SHA" \
            --title "Latest build: $(head -1 dist/BUILD.txt)" \
            --notes "The newest Croc-O-Synth development build, replaced on every build. See CHANGELOG.md for what is in it."


  # The same firmware code compiled for the browser (fm1-base's emulator: ./build.sh --web), published as the
  # repository's GitHub Pages site from the gh-pages branch: https://OWNER.github.io/REPO/
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages and font shaping
        run: |
          python3 -m pip install Pillow fonttools
          sudo apt-get install -y -qq libfribidi0

      - name: Emscripten (a fixed version, from its own repository)
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 3.1.74
          ~/emsdk/emsdk activate 3.1.74
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build the browser emulator
        run: |
          ./build.sh --web
          ls -l app/build/emu

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: croc-o-synth-web
          path: app/build/emu/
          if-no-files-found: error

      - name: Publish to the gh-pages branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/emu
          rm -rf o2 web
          sed -i 's/CROCOSYNTH/Croc-O-Synth/g' index.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Croc-O-Synth in the browser, built from $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
