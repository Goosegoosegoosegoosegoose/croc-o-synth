# Croc-O-Synth's build settings (base/tools/build.py). Adapted from fm1-base's template/fm1.toml (MPL-2.0).
name = "CROCOSYNTH"            # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_58"          # package identity (each firmware its own): dev FM-1_5800, releases FM-1_58XXYYZZ
usb_manufacturer = "goose"
usb_product = "CROC-O-SYNTH FM-1"
o2 = []                        # separate units compiled at -O2
words = "words.tsv"
ble = false                    # no Bluetooth
ble_central = false
# the site (base/tools/make_site.py)
tagline = "a crocodile teaches synth basics"
repo = "https://github.com/Goosegoosegoosegoosegoose/croc-o-synth"
licence = "PolyForm-Noncommercial-1.0.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp by Leo Kuroshita (both MPL-2.0)."
# firmware.json, for firmware hubs: the build writes it from these and the keys above
author = "goose"
description = "A kid-friendly firmware for the FM-1. A crocodile teaches synth basics, one lesson a button: teeth are the wave, rows of teeth are unison, the jaws are the filter."
tags = ["synth"]
